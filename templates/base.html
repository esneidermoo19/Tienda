<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}LuxeShop{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}LuxeShop - Tu tienda online premium{% endblock %}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50:  '#fdf8f0',
                            100: '#faefd9',
                            200: '#f5ddb0',
                            300: '#eec47d',
                            400: '#e5a44a',
                            500: '#d4882a',
                            600: '#b86c1f',
                            700: '#95521b',
                            800: '#79421d',
                            900: '#64371a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-active { border-bottom: 3px solid #d4882a; color: #d4882a; font-weight: 600; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #6b7280; }
        .form-panel { display: none; }
        .form-panel.active { display: block; }
        .input-field {
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-field:focus {
            border-color: #d4882a;
            box-shadow: 0 0 0 3px rgba(212, 136, 42, 0.15);
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4882a 0%, #b86c1f 100%);
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(212,136,42,0.4);
            filter: brightness(1.05);
        }
        .btn-primary:active { transform: translateY(0); }
        .alert-slide { animation: slideDown 0.35s ease-out; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .banner-overlay {
            background: linear-gradient(135deg, rgba(10,8,5,0.82) 0%, rgba(30,18,5,0.75) 100%);
        }
        .glass-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(12px);
        }
        .badge-offer {
            background: linear-gradient(135deg, #d4882a, #e5a44a);
            animation: pulse-badge 2.5s infinite;
        }
        @keyframes pulse-badge {
            0%, 100% { box-shadow: 0 0 0 0 rgba(212,136,42,0.5); }
            50%       { box-shadow: 0 0 0 8px rgba(212,136,42,0); }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 antialiased">
    {% block content %}{% endblock %}
</body>
</html>
